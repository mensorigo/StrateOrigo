[package]
name = "so-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# so-data：数据层（docs/06）。冷路径 crate：允许堆分配与任意 I/O。
# 本阶段（M2 首步）只做 normalize：Raw Journal → 统一 Parquet 表。
[dependencies]
so-core.workspace = true
so-model.workspace = true
so-adapter-gate.workspace = true
so-book.workspace = true
so-journal.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
toml = "1.1.1"
tracing.workspace = true

# Raw Journal 读取（与写入端共用 so-journal 的 zstd 版本）
zstd = "0.13.3"

# 数据集哈希（docs/06 §7；与 so-journal 同一 sha2 版本）
sha2 = "0.10.9"

# Parquet（docs/06 §4.1 统一表；zstd 压缩）
arrow = "60.1.0"
parquet = { version = "60.1.0", features = ["arrow", "zstd"] }

[dev-dependencies]
# book-check example：离线报告工具（拉 REST 合约元数据、解压 Journal）。
# 只进 example，不进 lib 与测试（A6：冷路径网络依赖，用途见文件头）。
tokio = { version = "1.51.1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "http2"] }
zstd = "0.13.3"

[lints]
workspace = true
