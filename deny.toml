# cargo-deny 规则（docs/02 §6、docs/04 S7）。运行：cargo deny check

[graph]
all-features = true
# 只检查项目目标平台的依赖图（docs/02 §1）：Windows 开发机 + Linux VPS。
# 不做此限定时会连带 wasm32 目标的平台专属依赖——arrow → ahash 在
# wasm 上启用 compile-time-rng → const-random → tiny-keccak（CC0-1.0），
# 而该链在两个目标平台上根本不会编译。见 ADR-0014。
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # 只可能来自 WebPKI 根证书数据包（webpki-roots / webpki-root-certs，
    # 代码本身是 Apache-2.0）。见 ADR-0012；新增任何代码许可证仍需单独 ADR。
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# 服务端完全无头（docs/01 §3.1）：核心 workspace 不得出现任何 GUI crate。
# 桌面端（P2）是独立 workspace，不受此限制。
deny = [
    { name = "gpui" },
    { name = "gpui-pre" },
    { name = "gpui-component" },
    { name = "winit" },
    { name = "eframe" },
    { name = "egui" },
    { name = "tauri" },
    { name = "iced" },
    { name = "slint" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
